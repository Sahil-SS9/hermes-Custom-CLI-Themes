    - (⚔)
    - (◉)
    - (⌁)
    - (▲)
  thinking_faces:
    - (⚔)
    - (⌁)
    - (◉)
  thinking_verbs:
    - drawing steel
    - reading the wind
    - finding stillness
    - cutting noise
    - holding breath
    - measuring distance
    - waiting in shadow
    - tempering the edge
    - watching the line
    - feeling the weight
    - seeking the opening
    - preparing the cut
